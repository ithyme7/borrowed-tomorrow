name: Deploy demo to GitHub Pages

# Prepared locally; manual publication only after owner review/approval.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@v7
      - name: Install, build, and upload static demo
        uses: withastro/action@v6
        with:
          node-version: 24
        env:
          PUBLIC_SANITY_PROJECT_ID: 'v9cykwdr'
          PUBLIC_SANITY_DATASET: 'production'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the reviewed demo
        id: deployment
        uses: actions/deploy-pages@v5
